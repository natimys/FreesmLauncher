<html lang="en">
<head>

<title>ModLock · FreesmLauncher design prototype</title>
<style>
:root{color-scheme:dark;--bg:#202327;--panel:#292d32;--panel2:#30353b;--line:#3c4249;--text:#f2f3f4;--muted:#aab1b9;--soft:#77818c;--accent:#87aadd;--accent2:#526f98;--green:#9ac9a3;--amber:#e5bf77;--red:#e29595;--radius:9px;--shadow:0 16px 40px #0004}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:8px 12px;cursor:pointer}button:hover{border-color:#6a7684;background:#3a4148}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent2);border-color:#728db2;color:#fff;font-weight:650}.quiet{background:transparent}.danger{color:var(--red)}input,select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px}.app{height:100vh;min-height:680px;display:grid;grid-template-columns:224px 1fr}.rail{background:#1b1e21;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;padding:2px 8px}.mark{width:28px;height:28px;border-radius:8px;background:#637fa7;display:grid;place-items:center;font-size:15px;color:white}.instance{border-block:1px solid var(--line);padding:15px 8px}.small{font-size:12px;color:var(--muted)}.nav{display:grid;gap:4px}.nav button{border:0;text-align:left;background:transparent;color:var(--muted);padding:10px 11px}.nav button.active,.nav button:hover{background:#30363d;color:var(--text)}.nav button.active{box-shadow:inset 2px 0 var(--accent)}.mock{margin-top:auto;color:var(--soft);font-size:11px;padding:8px}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:50px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;color:var(--muted);font-size:12px}.canvas{padding:24px 28px 20px;overflow:auto;max-width:1500px;width:100%;margin:0 auto;flex:1}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:19px}.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.title{font-size:24px;line-height:1.2;margin:4px 0 5px;font-weight:660;letter-spacing:-.02em}.sub{color:var(--muted);font-size:13px}.status{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:currentColor}.sectionnav{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:14px}.sectionnav button{border:0;border-radius:0;background:none;color:var(--muted);padding:9px 2px 11px}.sectionnav button.active{color:var(--text);border-bottom:2px solid var(--accent)}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}.search{width:min(350px,38vw);margin-right:4px}.select{padding:8px 10px;color:var(--muted)}.spacer{flex:1}.count{font-size:12px;color:var(--muted);padding:2px 1px 9px}.split{display:grid;grid-template-columns:minmax(420px,1.9fr) minmax(280px,.9fr);gap:14px;min-height:440px}.listpane,.detail,.surface{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.listpane{overflow:hidden}.listhead{height:39px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 136px 100px;align-items:center;padding:0 14px;color:var(--muted);font-size:11px}.rows{max-height:calc(100vh - 380px);min-height:350px;overflow:auto}.row{display:grid;grid-template-columns:1fr 136px 100px;align-items:center;min-height:57px;padding:7px 14px;border-bottom:1px solid #343a40;cursor:pointer;gap:5px}.row:hover{background:#30363c}.row.selected{background:#344150;box-shadow:inset 2px 0 var(--accent)}.resource{display:flex;align-items:center;gap:11px;min-width:0}.icon{height:32px;width:32px;flex:none;border-radius:8px;background:#435669;display:grid;place-items:center;font-size:14px;font-weight:700;color:#e4edf6}.icon.gold{background:#65533c}.icon.plum{background:#594767}.icon.green{background:#3b5c50}.name{font-weight:580;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.targets{display:flex;gap:4px;flex-wrap:wrap}.badge{border:1px solid #4b5662;background:#333b43;color:#c8d1dc;padding:2px 6px;border-radius:5px;font-size:10px;white-space:nowrap}.badge.changed{border-color:#7d6843;color:#e8ca8e;background:#40392c}.state{font-size:11px;color:var(--muted)}.state.good{color:var(--green)}.state.warn{color:var(--amber)}.detail{padding:17px;display:flex;flex-direction:column;gap:14px}.detailtitle{display:flex;align-items:center;gap:12px}.detailtitle .icon{width:42px;height:42px}.detailtitle h2{font-size:18px;margin:0 0 2px}.detail hr{border:0;border-top:1px solid var(--line);width:100%;margin:0}.fieldlabel{color:var(--muted);font-size:11px;margin-bottom:5px}.targetcheck{display:flex;gap:8px}.check{flex:1;border:1px solid var(--line);border-radius:7px;padding:9px 8px;display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer}.check input{accent-color:var(--accent);margin:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.technical{font-size:12px;color:var(--muted);cursor:pointer}.footer{margin-top:13px;padding:10px 13px;background:#2b3035;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:12px}.footer .summary{color:var(--muted);font-size:12px}.footer button{margin-left:auto}.content{display:grid;gap:14px}.surface{padding:17px}.surface h2{font-size:15px;margin:0 0 12px}.kicker{color:var(--muted);font-size:12px}.hero{display:flex;align-items:center;gap:15px}.hero .icon{width:56px;height:56px;font-size:21px}.hero h2{font-size:20px;margin:0 0 4px}.stateline{margin:17px 0;padding:15px 16px;border:1px solid var(--line);border-radius:8px;display:flex;gap:12px;align-items:flex-start}.stateline h3{font-size:14px;margin:0 0 3px}.stateline p{margin:0;color:var(--muted);font-size:12px}.metrics{display:flex;gap:26px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:15px}.metric b{display:block;font-weight:600}.metric span{font-size:11px;color:var(--muted)}.reviewrow{display:grid;grid-template-columns:95px 1fr auto;gap:12px;align-items:center;padding:12px 1px;border-bottom:1px solid var(--line)}.reviewrow:last-child{border-bottom:0}.reviewtype{font-size:11px;color:var(--muted)}.path{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#d9dee5}.summarybox{background:#30363d;border-radius:8px;padding:12px 14px;display:flex;gap:18px;flex-wrap:wrap}.warningbox{border-left:3px solid var(--amber);background:#343128;padding:11px 13px;border-radius:5px;color:#e6d6b4;font-size:12px}.errorbox{border-left:3px solid var(--red);background:#382e30;padding:11px 13px;border-radius:5px;color:#e7c2c2;font-size:12px}.successbox{border-left:3px solid var(--green);background:#2e3832;padding:11px 13px;border-radius:5px;color:#c9e0cd;font-size:12px}.progress{height:6px;background:#41474e;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;width:72%;background:var(--accent)}.dialog{max-width:790px;margin:8px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:22px}.dialoghead{display:flex;justify-content:space-between;align-items:flex-start}.dialog h2{font-size:20px;margin:4px 0}.dialogfoot{display:flex;align-items:center;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:14px;margin-top:16px}.empty{text-align:center;padding:32px;color:var(--muted)}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px}.disclosure{color:var(--accent);font-size:12px;cursor:pointer}.hidden{display:none!important}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tagline{font-size:11px;color:var(--muted)}
@media(max-width:1100px){.app{grid-template-columns:190px 1fr}.canvas{padding:20px}.split{grid-template-columns:minmax(350px,1.5fr) minmax(260px,1fr)}.toolbar .search{width:260px}}
@media(max-width:850px){.app{grid-template-columns:60px 1fr}.rail{padding:16px 8px}.brand span,.instance,.nav button .label,.mock{display:none}.brand{justify-content:center}.nav button{text-align:center;padding:12px 4px}.canvas{padding:16px}.split{grid-template-columns:1fr}.detail{display:none}.toolbar{gap:6px}.toolbar .search{width:100%;max-width:none}.listhead,.row{grid-template-columns:1fr 116px 82px}.title{font-size:21px}}
</style>

<body><div class="app"><aside class="rail"><div class="brand"><div class="mark">F</div><span>Freesm Launcher</span></div><div class="instance"><div class="small">CURRENT INSTANCE</div><b>Clockwork Valley</b><div class="small">Fabric · 1.21.1</div></div><nav class="nav" id="nav"></nav><div class="mock">DESIGN PROTOTYPE<br>All content is mock data</div></aside><main class="main"><div class="topbar">Instances&nbsp; / &nbsp;Clockwork Valley&nbsp; / &nbsp;<span id="crumb">Pack Editor</span></div><div class="canvas" id="canvas"></div></main></div>
<script>
const mods=[['Sodium','0.6.13','Modrinth','Client','Healthy','S','green'],['Lithium','0.15.0','Modrinth','Server','Healthy','L','plum'],['FerriteCore','7.0.2','Modrinth','Client + Server','Healthy','F','gold'],['Fabric API','0.102.0','Modrinth','Client + Server','Changed here','F','green'],['Create','6.0.6','Modrinth','Client + Server','Healthy','C','gold'],['ModernFix','5.20.0','Modrinth','Client + Server','Healthy','M','plum'],['Krypton','0.2.8','Modrinth','Server','Healthy','K','green'],['Iris Shaders','1.8.8','Modrinth','Client','Healthy','I','plum'],['Indium','1.0.35','Modrinth','Client','Healthy','I','gold'],['Architectury API','13.0.8','Modrinth','Client + Server','Healthy','A','green'],['Cloth Config','15.0.140','Modrinth','Client + Server','Healthy','C','plum'],['AppleSkin','3.0.6','CurseForge','Client','Healthy','A','gold'],['Jade','15.10.3','CurseForge','Client + Server','Healthy','J','green'],['YUNG’s Better Dungeons','5.0.4','Modrinth','Server','Healthy','Y','plum'],['Map Atlases','1.6.0','Unavailable','Client','Metadata unavailable','?','gold'],['Sound Physics','1.4.8','Modrinth','Client','Healthy','S','green'],['Geckolib','4.7.1','CurseForge','Client + Server','Healthy','G','plum'],['Xaero’s Minimap','25.2.0','Modrinth','Client','Healthy','X','gold'],['ServerCore','1.5.6','Modrinth','Server','Healthy','S','green'],['Pack config: common.toml','—','Local file','Client + Server','Changed here','≡','gold']];
const pages=['Pack Editor','Mod details','Files','Review & Publish','Modpack Overview','Update preview','Conflict','Import'];let current='Pack Editor',selected=0,status='Ready · Up to date';
const nav=document.getElementById('nav'),canvas=document.getElementById('canvas');
function button(text,cls='',action=''){return `<button class="${cls}" ${action?`onclick="${action}"`:''}>${text}</button>`}
function go(p){current=p;render()}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function badge(t){return `<span class="badge">${t}</span>`}function header(k,t,s,action=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><div class="title">${t}</div><div class="sub">${s}</div></div>${action}</div>`}function card(content){return `<section class="surface">${content}</section>`}
function render(){document.getElementById('crumb').textContent=current;nav.innerHTML=pages.map((p,i)=>`<button class="${p===current?'active':''}" onclick="go('${p}')"><span>${['▦','◉','▤','✓','◈','↻','!','⇧'][i]}</span><span class="label">&nbsp;&nbsp;${p}</span></button>`).join('');canvas.innerHTML=({'Pack Editor':editor,'Mod details':details,'Files':files,'Review & Publish':review,'Modpack Overview':overview,'Update preview':update,'Conflict':conflict,'Import':importPage}[current])()}
function editor(){let m=mods[selected];return header('AUTHOR WORKSPACE · MAIN','Clockwork Valley','Pack 1.8.1 · Minecraft 1.21.1 · Fabric 0.16.10',`<span class="status"><i class="dot"></i> Workspace ready</span>`)+`<div class="sectionnav"><button class="active">Mods <span class="small">326</span></button><button onclick="go('Files')">Files <span class="small">34</span></button><button onclick="go('Files')">Excluded <span class="small">6</span></button></div><div class="toolbar"><input id="search" class="search" placeholder="Search mods, files, provider…" oninput="filterRows()" aria-label="Search mods"><select class="select" id="targetFilter" onchange="filterRows()"><option>All targets</option><option>Client</option><option>Server</option><option>Shared</option></select><select class="select" id="stateFilter" onchange="filterRows()"><option>All states</option><option>Changed</option><option>Excluded</option></select><button class="quiet">⇅ Sort: Name</button><span class="spacer"></span>${button('Add mod')}${button('Review changes','primary',"go('Review & Publish')")}</div><div class="count" id="visibleCount">Showing 20 of 326 mods · 3 local changes</div><div class="split"><section class="listpane"><div class="listhead"><span>MOD</span><span>TARGET</span><span>STATE</span></div><div class="rows" id="rows">${rows()}</div></section>${detailpane(m)}</div><div class="footer"><span class="badge changed">3 changes</span><span class="summary">2 mods · 1 file · not published</span>${button('Review changes','primary',"go('Review & Publish')")}</div>`}
function rows(){return mods.map((m,i)=>`<div class="row ${i===selected?'selected':''}" data-search="${m.join(' ').toLowerCase()}" data-target="${m[3]}" data-state="${m[4]}" onclick="selected=${i};render()"><div class="resource"><div class="icon ${m[6]}">${m[5]}</div><div style="min-width:0"><div class="name">${esc(m[0])}</div><div class="meta">${m[1]} · ${m[2]}</div></div></div><div class="targets">${m[3]==='Client + Server'?badge('Client')+badge('Server'):badge(m[3])}</div><div class="state ${m[4]==='Healthy'?'good':m[4]==='Changed here'?'warn':''}">${m[4]}</div></div>`).join('')}
function detailpane(m){return `<aside class="detail"><div class="detailtitle"><div class="icon ${m[6]}">${m[5]}</div><div><h2>${esc(m[0])}</h2><div class="small">${m[1]} · ${m[2]}</div></div></div><hr><div><div class="fieldlabel">INCLUDED ON</div><div class="targetcheck"><label class="check"><input type="checkbox" checked> Client</label><label class="check"><input type="checkbox" ${m[3]!=='Client'?'checked':''}> Server</label></div><div class="small" style="margin-top:6px">Client + Server selects two targets.</div></div><div><div class="fieldlabel">PACK STATE</div><span class="state ${m[4]==='Healthy'?'good':'warn'}">● &nbsp;${m[4]}</span></div><hr><div class="actions">${button('Change targets','primary')}${button('Choose version…')}${button('Exclude from pack','quiet')}${button('More actions','quiet')}</div><details><summary class="technical">Technical details</summary><p class="small">File · ${m[0].toLowerCase().replaceAll(' ','-')}-${m[1]}.jar<br>Source/IDs · available when metadata exists<br>Full digest · hidden until expanded</p></details></aside>`}
function filterRows(){let q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('targetFilter').value,s=document.getElementById('stateFilter').value,n=0;document.querySelectorAll('.row').forEach(r=>{let targetOK=t==='All targets'||(t==='Shared'?r.dataset.target==='Client + Server':r.dataset.target.includes(t)),ok=r.dataset.search.includes(q)&&targetOK&&(s==='All states'||(s==='Changed'?r.dataset.state==='Changed here':r.dataset.state==='Excluded'));r.style.display=ok?'':'none';if(ok)n++});document.getElementById('visibleCount').textContent=`Showing ${n} of 326 mods · 3 local changes`}
function details(){let m=mods[selected];return header('PACK EDITOR · SELECTED MOD',m[0],`${m[1]} · ${m[2]}`)+`<div class="two">${card(`<div class="hero"><div class="icon ${m[6]}">${m[5]}</div><div><h2>${m[0]}</h2><div class="kicker">Installed version ${m[1]} · Source ${m[2]}</div></div></div><hr style="border-color:var(--line);margin:16px 0"><div class="fieldlabel">INCLUDED ON</div><div class="targetcheck"><label class="check"><input type="checkbox" checked> Client</label><label class="check"><input type="checkbox" checked> Server</label></div><div class="kicker" style="margin-top:8px">These are two explicit pack targets.</div><div class="actions" style="margin-top:17px">${button('Apply targets','primary')}${button('Choose version…')}${button('Exclude from pack')}${button('Stop managing')}</div>`) }${card(`<h2>State</h2><div class="successbox">Included · Present on client and server</div><p class="kicker">Provider metadata is available. Local files are unchanged by editing pack membership.</p><details><summary class="disclosure">Technical details</summary><p class="path">File: sodium-fabric-0.6.13.jar<br>Project ID: sodium<br>Revision: see current preview</p></details>`)}</div>`}
function files(){let data=[['config/common.toml','Client + Server','Update from pack','Changed here'],['config/server.toml','Server','Update from pack','Present'],['resourcepacks/seasonal.zip','Client','Install when missing','Present'],['kubejs/server_scripts/recipes.js','Server','Update from pack','Present'],['options.txt','Client','On this computer only','Unmanaged']];return header('AUTHOR WORKSPACE','Files','34 included · local changes are reviewed before any update',button('Add file or path…','primary'))+`<div class="toolbar"><input class="search" placeholder="Search paths…"><select class="select"><option>All targets</option><option>Client</option><option>Server</option></select><select class="select"><option>All states</option><option>Changed here</option><option>Missing</option></select></div>${card(data.map(r=>`<div class="reviewrow"><div class="path">${r[0]}</div><div>${badge(r[1])} &nbsp; <span class="small">${r[2]}</span></div><div class="state ${r[3]==='Changed here'?'warn':''}">${r[3]}</div></div>`).join('')+`<details style="margin-top:15px"><summary class="technical">Watch for files · 12 paths</summary><p class="small">Tracked paths are scanned for pack changes. Local-only files are not published.</p></details>`)}`}
function review(){return header('AUTHOR WORKSPACE','Review changes','Preview snapshot · 3 changes · generated from the current workspace',`<span class="status" style="color:var(--amber)"><i class="dot"></i> Review required</span>`)+`<div class="content">${card(`<div class="summarybox"><span><b>3 changes</b></span><span>2 mods</span><span>1 file</span><span>Client 2</span><span>Server 2</span></div><h2 style="margin-top:16px">Included in this publication</h2><div class="reviewrow"><div class="reviewtype">ADDED MOD</div><div><b>ServerCore</b><div class="small">1.5.6 · Modrinth</div></div><div>${badge('Server')}</div></div><div class="reviewrow"><div class="reviewtype">UPDATED MOD</div><div><b>Fabric API</b><div class="small">0.101.0 → 0.102.0</div></div><div>${badge('Client')}${badge('Server')}</div></div><div class="reviewrow"><div class="reviewtype">UPDATED FILE</div><div><span class="path">config/common.toml</span><div class="small">Update from pack · local edits detected</div></div><div>${badge('Client')}${badge('Server')}</div></div><details style="margin-top:12px"><summary class="technical">Excluded from this pack · 6 resources</summary><p class="small">Not included in the published snapshot.</p></details>`)}${card(`<h2>Publication</h2><div class="field"><label for="msg">Change summary</label><input id="msg" value="Update shared mods and config"></div><div class="warningbox">Publishing creates a local commit and sends it to the configured pack remote. A remote failure can leave a local commit that still needs attention.</div><div class="dialogfoot">${button('Back to editor','quiet',"go('Pack Editor')")}<button class="primary" onclick="publish(this)">Publish 3 changes</button></div><div id="publishResult" class="small" style="margin-top:10px">Preview becomes stale after any edit and must be regenerated.</div>`)}</div>`}
function publish(el){el.disabled=true;el.textContent='Creating local commit…';let out=document.getElementById('publishResult');out.innerHTML='<div class="progress"><span></span></div><p>Sending to remote…</p>';setTimeout(()=>{el.textContent='Remote push failed';el.className='danger';el.disabled=false;out.innerHTML='<div class="errorbox">Saved locally; remote not updated. Review the workspace and retry when the remote is available.</div>'},1200)}
function overview(){const states=['Ready · Up to date','Checking for updates','Update available','Applying update','Local files modified','Recovery required','Offline · verified','Offline · unverified','Update failed','No author workspace'];let i=states.indexOf(status);if(i<0)i=0;let colors=['var(--green)','var(--accent)','var(--amber)','var(--accent)','var(--amber)','var(--red)','var(--green)','var(--amber)','var(--red)','var(--muted)'],texts=['Installed pack files pass available verification.','Checking the configured pack source…','Build 1.8.2 is ready to review.','Applying the exact checked revision…','Some files differ from the pack copy. Review before replacing them.','The update could not finish safely. This instance is retained.','The pack source is offline. Installed files passed available offline checks.','The pack source is offline. Some content is unverified; launch may be blocked.','The update could not be completed.','This instance is in player mode. Author tools appear when an author workspace is available.'];return header('PLAYER VIEW','Clockwork Valley','Installed pack 1.8.1 · Minecraft 1.21.1 · Fabric 0.16.10',button('Check for updates'))+card(`<div class="hero"><div class="icon green">C</div><div><h2>Clockwork Valley</h2><div class="kicker">Pack version 1.8.1 · From natimys/clockwork-valley</div></div></div><div class="stateline" style="border-left:3px solid ${colors[i]}"><span style="color:${colors[i]}">●</span><div><h3>${states[i]}</h3><p>${texts[i]}</p></div></div><div class="metrics"><div class="metric"><b>Minecraft 1.21.1</b><span>Game version</span></div><div class="metric"><b>Fabric 0.16.10</b><span>Loader</span></div><div class="metric"><b>Last checked · 12 min ago</b><span>May be out of date while offline</span></div></div><div style="display:flex;gap:8px;margin-top:18px">${button(i===2?'View changes':'View pack details','primary',"go('Update preview')")}${i===5?button('Recovery details','danger'):''}</div>`)+`<div class="toolbar" style="margin-top:15px"><span class="small">Preview states:</span><select class="select" onchange="status=this.value;render()">${states.map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}</select><span class="small">Global Play remains in launcher chrome.</span></div>`}
function update(){return header('CLOCKWORK VALLEY','Update preview','Installed 1.8.1 → available 1.8.2 · checked revision is pinned',`<span class="status" style="color:var(--amber)"><i class="dot"></i> Update available</span>`)+`<div class="content">${card(`<div class="summarybox"><b>5 changes</b><span>2 added</span><span>1 updated</span><span>1 removed</span><span>1 file</span></div><div class="reviewrow"><div class="reviewtype">ADDED</div><div><b>ServerCore 1.5.6</b><div class="small">New server performance mod</div></div><div>${badge('Server')}</div></div><div class="reviewrow"><div class="reviewtype">ADDED</div><div><b>Map Atlases 1.6.0</b><div class="small">Name unavailable from provider</div></div><div>${badge('Client')}</div></div><div class="reviewrow"><div class="reviewtype">UPDATED</div><div><b>Fabric API</b><div class="small">0.101.0 → 0.102.0</div></div><div>${badge('Client')}${badge('Server')}</div></div><details><summary class="technical">Removed · 1 mod and 1 managed file</summary><p class="path">mods/old-compat.jar<br>config/legacy.toml</p></details>`)}${card(`<div class="warningbox">One local configuration file has changed. ModLock will check it again before applying.</div><p class="kicker" style="margin:12px 0">Continuing applies this exact reviewed build. Your local files are checked again before any replacement.</p><div class="dialogfoot">${button('Back','quiet')}${button('Review local file','primary',"go('Conflict')")}<button onclick="updateSuccess(this)">Install without conflicts</button></div><div id="updateResult" class="small"></div>`)}</div>`}
function updateSuccess(el){document.getElementById('updateResult').innerHTML='<div class="successbox">Update complete · Clockwork Valley 1.8.2 is installed. Managed files finished applying successfully.</div>';el.disabled=true;el.textContent='Installed · 1.8.2'}
function conflict(){return header('UPDATE REVIEW','Some local files would change','The whole update is held until you choose what to do.')+`<div class="dialog"><div class="dialoghead"><div><div class="eyebrow">1 FILE NEEDS REVIEW</div><h2>Keep your local changes?</h2><div class="sub">This config differs from the version in the pack.</div></div><span class="badge changed">Local edits found</span></div><div class="reviewrow" style="margin-top:14px"><div class="path">config/common.toml</div><div><b>Replace with pack version</b><div class="small">Your current contents would be replaced</div></div><div>${badge('Client + Server')}</div></div><div class="warningbox" style="margin-top:12px">Keeping local files defers the entire update. The launcher cannot choose a mixed per-file outcome.</div><div class="dialogfoot"><button class="primary" onclick="this.innerHTML='Update deferred · local files kept'">Keep my local files and defer</button><button class="danger" onclick="this.innerHTML='Applying reviewed update…'">Replace these files and continue</button></div><div class="small" style="margin-top:10px">The file is checked again before writing. If it changed since review, you will be asked again.</div></div>`}
function importPage(){return header('NEW INSTANCE · MODLOCK','Import a modpack','Use a public pack repository link to create a new instance.')+`<div class="surface" style="max-width:760px"><div class="field"><label for="repo">Repository URL</label><input id="repo" style="width:100%" placeholder="https://github.com/creator/pack"></div><details><summary class="disclosure">Advanced options</summary><div class="two"><div class="field"><label>Branch</label><input value="main"></div><div class="field"><label>Lock file path</label><input value="mod.lock"></div></div></details><div class="toolbar" style="margin-top:14px"><select id="importScenario" class="select"><option value="success">Preview scenario · Successful pack</option><option value="schema">Unsupported schema</option><option value="profile">Game or loader unavailable</option><option value="network">Network unavailable</option></select><span class="spacer"></span>${button('Paste URL','quiet')}<button class="primary" onclick="showImport()">Preview pack</button></div><div id="importResult" class="hidden"></div><div class="small" style="margin-top:15px">Preview does not modify files. Supported repository link required.</div></div>`}
function showImport(){let type=document.getElementById('importScenario').value,r=document.getElementById('importResult');r.classList.remove('hidden');if(type==='success')r.innerHTML=`<hr style="border-color:var(--line);margin:18px 0"><div class="hero"><div class="icon gold">C</div><div><h2>Clockwork Valley</h2><div class="kicker">Pack 1.8.1 · Minecraft 1.21.1 · Fabric 0.16.10</div></div></div><div class="metrics" style="margin-top:14px"><div class="metric"><b>326 mods</b><span>Client and server</span></div><div class="metric"><b>34 managed files</b><span>From selected pack revision</span></div></div><div class="successbox" style="margin-top:15px">Schema 3 · explicit client and server targets</div><p class="small">This creates a new instance. Your existing library stays unchanged.</p><div class="dialogfoot"><button class="primary">Create instance</button></div>`;else r.innerHTML=`<div class="${type==='network'?'errorbox':'warningbox'}" style="margin-top:16px">${type==='schema'?'This pack uses a schema this launcher cannot read. Check that the repository points to a supported ModLock pack.':type==='profile'?'The exact Minecraft or loader version in this pack is not available. Review the pack profile or try again later.':'The pack source could not be reached. Check the address and connection, then retry.'}</div><button style="margin-top:10px" onclick="showImport()">Try again</button>`}
render();
</script></body></html>
