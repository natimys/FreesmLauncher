<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModLock · FreesmLauncher design prototype</title>
  <style>
    :root{color-scheme:dark;--bg:#202327;--rail:#1b1e21;--panel:#292d32;--panel2:#30353b;--line:#3c4249;--text:#f2f3f4;--muted:#aab1b9;--soft:#77818c;--accent:#87aadd;--accent2:#526f98;--green:#9ac9a3;--amber:#e5bf77;--red:#e29595;--radius:9px;--shadow:0 16px 40px #0006}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:8px 12px;cursor:pointer}button:hover{border-color:#6a7684;background:#3a4148}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent2);border-color:#728db2;color:#fff;font-weight:650}.quiet{background:transparent}.danger{color:var(--red)}button:disabled{opacity:.48;cursor:not-allowed}input,select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px}.app{height:100vh;min-height:620px;display:grid;grid-template-columns:226px minmax(0,1fr)}
    .rail{background:var(--rail);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:16px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;padding:2px 8px}.mark{width:29px;height:29px;border-radius:8px;background:#637fa7;display:grid;place-items:center;color:white}.nav{display:grid;gap:3px}.nav button{border:0;text-align:left;background:transparent;color:var(--muted);padding:9px 10px}.nav button.active,.nav button:hover{background:#30363d;color:var(--text)}.nav button.active{box-shadow:inset 2px 0 var(--accent)}.instance{border-block:1px solid var(--line);padding:13px 8px}.instance b{display:block;margin:3px 0}.small{font-size:12px;color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.rail-note{margin-top:auto;padding:10px 8px;border-top:1px solid var(--line);font-size:11px;color:var(--soft)}
    .main{min-width:0;display:flex;flex-direction:column}.topbar{min-height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:7px 22px;color:var(--muted);font-size:12px}.crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prototype-switch{margin-left:auto;display:flex;align-items:center;gap:9px;padding:5px 8px 5px 11px;border:1px solid #5d6570;background:#2b3036;border-radius:8px;color:var(--text)}.prototype-switch label{font-size:10px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}.prototype-switch select{padding:6px 9px;max-width:235px}.canvas{padding:23px 28px 22px;overflow:auto;max-width:1530px;width:100%;margin:0 auto;flex:1}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}.title{font-size:24px;line-height:1.2;margin:4px 0 5px;font-weight:660;letter-spacing:-.02em}.sub{color:var(--muted);font-size:13px}.status{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
    .sectionnav{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:13px}.sectionnav button{border:0;border-radius:0;background:none;color:var(--muted);padding:9px 2px 11px}.sectionnav button.active{color:var(--text);border-bottom:2px solid var(--accent)}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap}.search{width:min(350px,38vw);margin-right:3px}.select{padding:8px 10px;color:var(--muted)}.spacer{flex:1}.count{font-size:12px;color:var(--muted);padding:2px 1px 8px}.split{display:grid;grid-template-columns:minmax(390px,1.9fr) minmax(280px,.9fr);gap:13px;min-height:430px}.listpane,.detail,.surface{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.listpane{overflow:hidden}.listhead{height:38px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(160px,1fr) 138px 105px;align-items:center;padding:0 13px;color:var(--muted);font-size:10px;letter-spacing:.04em}.rows{height:min(57vh,570px);min-height:300px;overflow:auto;overscroll-behavior:contain}.row{display:grid;grid-template-columns:minmax(160px,1fr) 138px 105px;align-items:center;min-height:57px;padding:7px 13px;border-bottom:1px solid #343a40;cursor:pointer;gap:5px}.row:hover{background:#30363c}.row.selected{background:#344150;box-shadow:inset 2px 0 var(--accent)}.resource{display:flex;align-items:center;gap:10px;min-width:0}.icon{height:32px;width:32px;flex:none;border-radius:8px;background:#435669;display:grid;place-items:center;font-size:14px;font-weight:700;color:#e4edf6}.icon.gold{background:#65533c}.icon.plum{background:#594767}.icon.green{background:#3b5c50}.name{font-weight:590;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.targets{display:flex;gap:4px;flex-wrap:wrap}.badge{border:1px solid #4b5662;background:#333b43;color:#c8d1dc;padding:2px 6px;border-radius:5px;font-size:10px;white-space:nowrap}.badge.changed{border-color:#7d6843;color:#e8ca8e;background:#40392c}.state{font-size:11px;color:var(--muted)}.state.good{color:var(--green)}.state.warn{color:var(--amber)}
    .detail{padding:16px;display:flex;flex-direction:column;gap:13px;min-width:0;max-height:calc(100vh - 178px);overflow:auto}.detailtitle{display:flex;align-items:center;gap:11px}.detailtitle .icon{width:40px;height:40px}.detailtitle h2{font-size:17px;margin:0 0 2px}.detail hr{border:0;border-top:1px solid var(--line);width:100%;margin:0}.fieldlabel{color:var(--muted);font-size:10px;letter-spacing:.04em;margin-bottom:5px}.targetcheck{display:flex;gap:8px}.check{flex:1;border:1px solid var(--line);border-radius:7px;padding:9px 8px;display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer}.check input{accent-color:var(--accent);margin:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.technical{font-size:12px;color:var(--muted);cursor:pointer}.footer{margin-top:12px;padding:10px 12px;background:#2b3035;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:11px}.footer .summary{color:var(--muted);font-size:12px}.footer button{margin-left:auto}.mobile-detail-button,.mobile-close{display:none}
    .content{display:grid;gap:13px}.surface{padding:17px}.surface h2{font-size:15px;margin:0 0 12px}.kicker{color:var(--muted);font-size:12px}.hero{display:flex;align-items:center;gap:14px}.hero .icon{width:54px;height:54px;font-size:20px}.hero h2{font-size:20px;margin:0 0 4px}.stateline{margin:16px 0;padding:14px 15px;border:1px solid var(--line);border-radius:8px;display:flex;gap:12px;align-items:flex-start}.stateline h3{font-size:14px;margin:0 0 3px}.stateline p{margin:0;color:var(--muted);font-size:12px}.metrics{display:flex;gap:25px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}.metric b{display:block;font-weight:600}.metric span{font-size:11px;color:var(--muted)}.reviewrow{display:grid;grid-template-columns:95px minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px 1px;border-bottom:1px solid var(--line)}.reviewrow:last-child{border-bottom:0}.reviewtype{font-size:10px;color:var(--muted);letter-spacing:.04em}.path{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#d9dee5;overflow-wrap:anywhere}.summarybox{background:#30363d;border-radius:8px;padding:11px 13px;display:flex;gap:17px;flex-wrap:wrap}.warningbox,.errorbox,.successbox{padding:11px 13px;border-radius:5px;font-size:12px}.warningbox{border-left:3px solid var(--amber);background:#343128;color:#e6d6b4}.errorbox{border-left:3px solid var(--red);background:#382e30;color:#e7c2c2}.successbox{border-left:3px solid var(--green);background:#2e3832;color:#c9e0cd}.progress{height:6px;background:#41474e;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;width:8%;background:var(--accent);transition:width .25s ease}.dialog{max-width:820px;margin:8px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:21px}.dialoghead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.dialog h2{font-size:20px;margin:4px 0}.dialogfoot{display:flex;align-items:center;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:13px;margin-top:15px;flex-wrap:wrap}.empty{text-align:center;padding:32px;color:var(--muted)}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px}.disclosure{color:var(--accent);font-size:12px;cursor:pointer}.hidden{display:none!important}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.overlay{position:fixed;inset:0;background:#080a0caa;z-index:70;display:grid;place-items:center;padding:18px}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid #505862;border-radius:12px;box-shadow:var(--shadow);padding:20px}.catalog-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.prototype-note{color:var(--soft);font-size:11px}
    .file-list-head,.file-row{grid-template-columns:minmax(190px,1.5fr) minmax(125px,1fr) minmax(150px,1fr) 120px}    @media(max-width:1100px){.app{grid-template-columns:200px minmax(0,1fr)}.canvas{padding:19px}.split{grid-template-columns:minmax(350px,1.4fr) minmax(260px,1fr)}.toolbar .search{width:260px}.detail{padding:13px;gap:11px}}
    @media(max-width:850px){.app{grid-template-columns:58px minmax(0,1fr)}.rail{padding:15px 7px}.brand span,.instance,.nav-label,.rail-note{display:none}.brand{justify-content:center;padding:2px}.nav button{text-align:center;padding:11px 3px}.canvas{padding:16px}.topbar{padding:6px 12px;gap:7px;flex-wrap:wrap}.crumb{max-width:25vw}.prototype-switch{gap:6px;padding:4px 6px}.prototype-switch label{max-width:83px;white-space:normal;line-height:1.1}.prototype-switch select{max-width:185px}.split{grid-template-columns:minmax(0,1fr)}.detail{display:none}.detail.mobile-open{display:flex;position:fixed;z-index:80;top:72px;right:12px;bottom:12px;width:min(390px,calc(100vw - 84px));max-height:none;box-shadow:var(--shadow)}.mobile-close{display:inline-flex;margin-left:auto;padding:5px 9px}.mobile-detail-button{display:inline-flex}.toolbar{gap:6px}.toolbar .search{width:100%;max-width:none}.listhead,.row{grid-template-columns:minmax(130px,1fr) 112px 85px}.title{font-size:21px}.pagehead{gap:12px}.footer{flex-wrap:wrap}.footer button{margin-left:auto}}
    @media(max-width:560px){.file-list-head{display:none}.reviewrow.file-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:10px}.file-row>.path{grid-column:1/-1}.file-row>span:not(:first-child)::before{display:block;font-size:9px;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}.file-row>span:nth-child(2)::before{content:"INCLUDED ON"}.file-row>span:nth-child(3)::before{content:"UPDATE BEHAVIOR"}.file-row>span:nth-child(4)::before{content:"STATE"}}    @media(max-width:560px){.prototype-switch label{display:none}.prototype-switch select{max-width:145px}.topbar{font-size:11px}.canvas{padding:14px 12px}.pagehead{display:block}.pagehead>.status,.pagehead>button{margin-top:10px}.toolbar .spacer{display:none}.toolbar button{padding:7px 9px}.listhead,.row{grid-template-columns:minmax(105px,1fr) 94px 76px;padding-left:8px;padding-right:8px}.resource{gap:7px}.row{font-size:12px}.icon{height:29px;width:29px}.badge{font-size:9px;padding:2px 4px}.state{font-size:10px}.reviewrow{grid-template-columns:70px minmax(0,1fr);}.reviewrow>:last-child{grid-column:2}.two{grid-template-columns:1fr}.dialog{padding:16px}.dialogfoot{justify-content:stretch}.dialogfoot button{flex:1}.metrics{gap:14px}.sectionnav{gap:14px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Simulated FreesmLauncher navigation">
      <div class="brand"><div class="mark" aria-hidden="true">F</div><span>Freesm Launcher</span></div>
      <nav class="nav" aria-label="Launcher sections">
        <button title="Instances">▣ <span class="nav-label">&nbsp;Instances</span></button>
        <button title="Downloads">↓ <span class="nav-label">&nbsp;Downloads</span></button>
        <button title="Settings">⚙ <span class="nav-label">&nbsp;Settings</span></button>
      </nav>
      <div class="instance"><div class="eyebrow">Selected instance</div><b>Clockwork Valley</b><div class="small">Fabric · Minecraft 1.21.1</div></div>
      <div class="eyebrow nav-label">Proposed instance navigation</div>
      <nav class="nav" aria-label="Proposed production instance pages">
        <button title="Modpack">◈ <span class="nav-label">&nbsp;Modpack</span></button>
        <button title="Mods">▦ <span class="nav-label">&nbsp;Mods</span></button>
        <button title="Worlds">◇ <span class="nav-label">&nbsp;Worlds</span></button>
        <button title="Settings">⚙ <span class="nav-label">&nbsp;Settings</span></button>
        <button class="active" title="Pack Editor">▤ <span class="nav-label">&nbsp;Pack Editor</span></button>
      </nav>
      <div class="rail-note">PROTOTYPE ONLY<br>Mock data · no launcher/backend connection</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumb">Instances&nbsp; / &nbsp;Clockwork Valley&nbsp; / &nbsp;<span id="crumb">Pack Editor</span></div>
        <div class="prototype-switch"><label for="prototypeScreen">PROTOTYPE SCREEN<br><span class="prototype-note">demo route · not app navigation</span></label><select id="prototypeScreen" aria-label="Select prototype screen" onchange="go(this.value)"></select></div>
      </header>
      <div class="canvas" id="canvas"></div>
    </main>
  </div>
  <script>
    // All records and transitions below are local mock state. Nothing connects to ModLock.
    const resources = [
      {id:'sodium', name:'Sodium', version:'0.6.13', provider:'Modrinth', targets:['client'], state:'Healthy', icon:'S', tint:'green'},
      {id:'lithium', name:'Lithium', version:'0.15.0', provider:'Modrinth', targets:['server'], state:'Healthy', icon:'L', tint:'plum'},
      {id:'ferritecore', name:'FerriteCore', version:'7.0.2', provider:'Modrinth', targets:['client','server'], state:'Healthy', icon:'F', tint:'gold'},
      {id:'fabric-api', name:'Fabric API', version:'0.102.0', provider:'Modrinth', targets:['client','server'], state:'Changed here', icon:'F', tint:'green'},
      {id:'create', name:'Create', version:'6.0.6', provider:'Modrinth', targets:['client','server'], state:'Healthy', icon:'C', tint:'gold'},
      {id:'modernfix', name:'ModernFix', version:'5.20.0', provider:'Modrinth', targets:['client','server'], state:'Healthy', icon:'M', tint:'plum'},
      {id:'krypton', name:'Krypton', version:'0.2.8', provider:'Modrinth', targets:['server'], state:'Healthy', icon:'K', tint:'green'},
      {id:'iris', name:'Iris Shaders', version:'1.8.8', provider:'Modrinth', targets:['client'], state:'Healthy', icon:'I', tint:'plum'},
      {id:'indium', name:'Indium', version:'1.0.35', provider:'Modrinth', targets:['client'], state:'Healthy', icon:'I', tint:'gold'},
      {id:'architectury', name:'Architectury API', version:'13.0.8', provider:'Modrinth', targets:['client','server'], state:'Healthy', icon:'A', tint:'green'},
      {id:'cloth-config', name:'Cloth Config', version:'15.0.140', provider:'Modrinth', targets:['client','server'], state:'Healthy', icon:'C', tint:'plum'},
      {id:'appleskin', name:'AppleSkin', version:'3.0.6', provider:'CurseForge', targets:['client'], state:'Healthy', icon:'A', tint:'gold'},
      {id:'jade', name:'Jade', version:'15.10.3', provider:'CurseForge', targets:['client','server'], state:'Healthy', icon:'J', tint:'green'},
      {id:'yungs-dungeons', name:'YUNG’s Better Dungeons', version:'5.0.4', provider:'Modrinth', targets:['server'], state:'Healthy', icon:'Y', tint:'plum'},
      {id:'map-atlases', name:'Name unavailable', version:'1.6.0', provider:'Metadata unavailable', targets:['client'], state:'Metadata unavailable', icon:'?', tint:'gold', filename:'map-atlases-1.6.0.jar'},
      {id:'sound-physics', name:'Sound Physics', version:'1.4.8', provider:'Modrinth', targets:['client'], state:'Healthy', icon:'S', tint:'green'},
      {id:'geckolib', name:'Geckolib', version:'4.7.1', provider:'CurseForge', targets:['client','server'], state:'Healthy', icon:'G', tint:'plum'},
      {id:'xaeros-minimap', name:'Xaero’s Minimap', version:'25.2.0', provider:'Modrinth', targets:['client'], state:'Healthy', icon:'X', tint:'gold'},
      {id:'servercore', name:'ServerCore', version:'1.5.6', provider:'Modrinth', targets:['server'], state:'Healthy', icon:'S', tint:'green'},
      {id:'shader-compat-old', name:'Legacy Shader Compat', version:'1.2.0', provider:'CurseForge', targets:[], state:'Excluded', icon:'X', tint:'plum'}
    ];
    const managedFiles = [
      {path:'config/common.toml', targets:'Client + Server', policy:'Update from pack', state:'Changed here'},
      {path:'config/server.toml', targets:'Server', policy:'Update from pack', state:'Present'},
      {path:'resourcepacks/seasonal.zip', targets:'Client', policy:'Install when missing', state:'Present'},
      {path:'kubejs/server_scripts/recipes.js', targets:'Server', policy:'Update from pack', state:'Present'}
    ];
    const localOnlyFiles = [{path:'options.txt',targets:'Client',policy:'On this computer only',state:'Unmanaged'}];
    const catalog = [
      {id:'botania', name:'Botania', version:'1.20.1-448', provider:'Modrinth', suggestion:['client','server'], icon:'B', tint:'green'},
      {id:'servercore-new', name:'ServerCore', version:'1.5.7', provider:'Modrinth', suggestion:['server'], icon:'S', tint:'plum'},
      {id:'waystones', name:'Waystones', version:'16.0.5', provider:'CurseForge', suggestion:['client','server'], icon:'W', tint:'gold'}
    ];
    const prototypeScreens = ['Pack Editor','Mod details','Files','Review & Publish','Modpack Overview','Update preview','Conflict','Import'];
    const screenGlyphs = ['▦','◉','▤','✓','◈','↻','!','⇧'];
    let screen = 'Pack Editor';
    let selectedResourceId = 'sodium';
    let selectedFilePath = managedFiles[0].path;
    let mobileDetailsOpen = false;
    let playerState = 'Ready · Up to date';
    let editorState = {query:'', target:'All targets', state:'All states', sort:'Name', scrollTop:0};
    let targetDrafts = {};
    const mockActionChanges = [];
    let localChangeCount = 3;
    let packVersion = '1.8.1';
    let publishTimer = null;

    const canvas = document.getElementById('canvas');
    const screenSelect = document.getElementById('prototypeScreen');
    screenSelect.innerHTML = prototypeScreens.map((name,i)=>`<option value="${name}">${screenGlyphs[i]} &nbsp; ${name}</option>`).join('');

    function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function button(label,cls='',action=''){return `<button class="${cls}" ${action?`onclick="${action}"`:''}>${label}</button>`}
    function badge(label){return `<span class="badge">${escapeHTML(label)}</span>`}
    function targetsText(targets){if(targets.length===0)return 'No targets';if(targets.length===2)return 'Client + Server';return targets[0]==='server'?'Server':'Client'}
    function targetBadges(targets){return targets.length?targets.map(t=>badge(t==='client'?'Client':'Server')).join(''):badge('No targets')}
    function getResource(id){return resources.find(r=>r.id===id)||resources[0]}
    function header(kicker,title,subtitle,action=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><div class="title">${title}</div><div class="sub">${subtitle}</div></div>${action}</div>`}
    function card(content){return `<section class="surface">${content}</section>`}
    function navTo(next){render(next)}

    function captureEditorState(){
      if(screen!=='Pack Editor')return;
      const query=document.getElementById('modSearch');
      const target=document.getElementById('targetFilter');
      const state=document.getElementById('stateFilter');
      const sort=document.getElementById('sortBy');
      const rows=document.getElementById('modRows');
      if(query)editorState.query=query.value;
      if(target)editorState.target=target.value;
      if(state)editorState.state=state.value;
      if(sort)editorState.sort=sort.value;
      if(rows)editorState.scrollTop=rows.scrollTop;
    }
    function render(nextScreen=screen){
      captureEditorState();
      if(nextScreen!==screen)closeAddDialog();
      screen=nextScreen;
      document.getElementById('crumb').textContent=screen;
      screenSelect.value=screen;
      const views={'Pack Editor':renderEditor,'Mod details':renderModDetails,'Files':renderFiles,'Review & Publish':renderReview,'Modpack Overview':renderOverview,'Update preview':renderUpdate,'Conflict':renderConflict,'Import':renderImport};
      canvas.innerHTML=views[screen]();
      if(screen==='Pack Editor')restoreEditorState();
      if(screen==='Review & Publish')refreshReviewView();
    }
    function go(nextScreen){render(nextScreen)}

    function sortedResources(){
      const items=[...resources];
      const sort=editorState.sort;
      const value=r=>sort==='Version'?r.version:sort==='Provider'?r.provider:sort==='Target'?targetsText(r.targets):sort==='State'?r.state:r.name;
      return items.sort((a,b)=>value(a).localeCompare(value(b),undefined,{numeric:true,sensitivity:'base'}));
    }
    function resourceRow(r){
      const searchable=[r.name,r.filename||'',r.version,r.provider,r.id].join(' ').toLowerCase();
      const stateClass=r.state==='Healthy'?'good':r.state==='Changed here'||r.state==='Metadata unavailable'?'warn':'';
      return `<div class="row ${r.id===selectedResourceId?'selected':''}" role="option" aria-selected="${r.id===selectedResourceId}" tabindex="0" data-id="${r.id}" data-search="${escapeHTML(searchable)}" data-target="${targetsText(r.targets)}" data-state="${escapeHTML(r.state)}" onclick="selectResource('${r.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectResource('${r.id}')}" aria-label="${escapeHTML(r.name)}, ${escapeHTML(r.version)}, ${escapeHTML(targetsText(r.targets))}"><div class="resource"><div class="icon ${r.tint}" aria-hidden="true">${r.icon}</div><div style="min-width:0"><div class="name">${escapeHTML(r.name)}</div><div class="meta">${escapeHTML(r.version)} · ${escapeHTML(r.provider)}</div></div></div><div class="targets">${targetBadges(r.targets)}</div><div class="state ${stateClass}">${escapeHTML(r.state)}</div></div>`;
    }
    function renderEditor(){
      const resource=getResource(selectedResourceId);
      const changedMods=2+mockActionChanges.filter(change=>change.kind==='mod').length;
      const changedFiles=1+mockActionChanges.filter(change=>change.kind==='file').length;
      return header('AUTHOR WORKSPACE · MOCK PACK','Clockwork Valley','Pack 1.8.1 · Minecraft 1.21.1 · Fabric 0.16.10',`<span class="status"><i class="dot"></i> Workspace ready</span>`)+

    function detailPane(resource,kind){
      if(kind==='file')return fileDetail(resource);

      return `<aside id="detailPane" class="detail ${mobileDetailsOpen?'mobile-open':''}" aria-label="Selected mod details"><div class="detailtitle"><div class="icon ${resource.tint}" aria-hidden="true">${resource.icon}</div><div><h2 tabindex="-1">${escapeHTML(resource.name)}</h2><div class="small">${escapeHTML(resource.version)} · ${escapeHTML(resource.provider)}</div></div><button class="mobile-close" aria-label="Close mod details" onclick="closeMobileDetails()">Close</button></div><div id="selectionVisibility" class="small" role="status"></div><hr><div><div class="fieldlabel">INCLUDED ON</div><div class="targetcheck"><label class="check"><input type="checkbox" aria-label="Include ${escapeHTML(resource.name)} on Client" ${draft.includes('client')?'checked':''} onchange="editTarget('${resource.id}','client',this.checked)">Client</label><label class="check"><input type="checkbox" aria-label="Include ${escapeHTML(resource.name)} on Server" ${draft.includes('server')?'checked':''} onchange="editTarget('${resource.id}','server',this.checked)">Server</label></div><div class="small" style="margin-top:6px">Shared means both target IDs are selected.</div><div id="targetFeedback" class="small" role="status" style="margin-top:6px">${dirty?'Unsaved target changes.':resource.state==='Excluded'?'Excluded from the pack; select a target to include it again.':'Targets match this resource.'}</div><button id="applyTargets" class="primary" style="margin-top:8px;width:100%" onclick="applyTargets('${resource.id}')" ${!dirty||draft.length===0?'disabled':''}>Apply targets</button>${draft.length===0?'<div class="warningbox" style="margin-top:7px">Choose at least one target before applying.</div>':''}</div><hr><div><div class="fieldlabel">PACK STATE</div><span class="state ${resource.state==='Healthy'?'good':'warn'}">● &nbsp;${escapeHTML(resource.state)}</span></div><div class="actions"><button onclick="openAddDialog()">Choose version…</button><button class="quiet" onclick="excludeSelectedResource()" ${resource.state==='Excluded'?'disabled':''}>${resource.state==='Excluded'?'Excluded from pack':'Exclude from pack'}</button></div><details><summary class="technical">Technical details</summary><p class="small">File · <span class="path">${escapeHTML(filename)}</span><br>Stable ID · ${escapeHTML(resource.id)}<br>Digest · available in real workspace data</p></details></aside>`;
    }
    function restoreEditorState(){
      const query=document.getElementById('modSearch');const target=document.getElementById('targetFilter');const state=document.getElementById('stateFilter');const sort=document.getElementById('sortBy');const rows=document.getElementById('modRows');

      rows.scrollTop=editorState.scrollTop;applyFilters();

    function applyFilters(){
      const rows=document.getElementById('modRows');if(!rows)return;

      rows.querySelectorAll('.row').forEach(row=>{
        const targetOK=editorState.target==='All targets'||(editorState.target==='Shared'?row.dataset.target==='Client + Server':row.dataset.target.includes(editorState.target));
        const stateOK=editorState.state==='All states'||(editorState.state==='Changed'?['Changed here','Added locally'].includes(row.dataset.state):row.dataset.state==='Excluded');
        const visible=row.dataset.search.includes(query)&&targetOK&&stateOK;row.classList.toggle('hidden',!visible);if(visible)shown++;
      });
      const empty=document.getElementById('emptyRows');if(empty)empty.classList.toggle('hidden',shown!==0);
      const selectedRow=rows.querySelector(`.row[data-id="${CSS.escape(selectedResourceId)}"]`);const visibility=document.getElementById('selectionVisibility');if(visibility)visibility.textContent=selectedRow?.classList.contains('hidden')?'Selected resource is outside the current results.':'';

    function openMobileDetails(){const detail=document.getElementById('detailPane');if(detail){mobileDetailsOpen=true;detail.classList.add('mobile-open');detail.querySelector('h2')?.focus()}}
    function closeMobileDetails(){mobileDetailsOpen=false;document.getElementById('detailPane')?.classList.remove('mobile-open');const row=document.querySelector(`.row[data-id="${CSS.escape(selectedResourceId)}"]`);if(row&&!row.classList.contains('hidden'))row.focus();else document.getElementById('modSearch')?.focus()}
    function editTarget(id,target,checked){
      const resource=getResource(id);const next=[...(targetDrafts[id]||resource.targets)];const index=next.indexOf(target);if(checked&&index<0)next.push(target);if(!checked&&index>=0)next.splice(index,1);targetDrafts[id]=next;

      if(apply)apply.disabled=!dirty||next.length===0;if(feedback)feedback.textContent=next.length===0?'Choose at least one target.':dirty?'Unsaved target changes.':'Targets match this resource.';

    function applyTargets(id){
      const resource=getResource(id);const next=targetDrafts[id]||resource.targets;if(!next.length)return;

    function excludeSelectedResource(){

    function addSelectedMod(){const item=catalog.find(x=>x.id===selectedCatalogId);if(!item)return;const targets=[];if(document.getElementById('newClient').checked)targets.push('client');if(document.getElementById('newServer').checked)targets.push('server');if(!targets.length)return;resources.push({id:item.id,name:item.name,version:item.version,provider:item.provider,targets,state:'Added locally',icon:item.icon,tint:item.tint});selectedResourceId=item.id;mockActionChanges.push({kind:'mod',action:'Added mod',name:item.name,detail:`${item.version} · ${item.provider}`,targets:[...targets]});localChangeCount=3+mockActionChanges.length;closeAddDialog();render('Pack Editor')}

ublish ${localChangeCount} changes</button></div><div id="publishFeedback" role="status" aria-live="polite" class="small" style="margin-top:10px">No publication has been attempted.</div>`)}</div>`}

    function deferUpdate(){document.getElementById('conflictFeedback').innerHTML='<div class="successbox">Update deferred · local file kept · no part of the update was applied.</div>';document.querySelectorAll('.dialogfoot button').forEach(b=>b.disabled=true)}
    function replaceConflicts(){document.getElementById('conflictFeedback').innerHTML='<div class="successbox">Mock update applied · the reviewed file set was replaced.</div>';packVersion='1.8.2';playerState='Ready · Up to date';document.querySelectorAll('.dialogfoot button').forEach(b=>b.disabled=true)}

    function renderImport(){return header('NEW INSTANCE · MODLOCK','Import a modpack','Use a public pack repository URL to create a new instance.')+`<div class="surface" style="max-width:780px"><div class="field"><label for="repoUrl">Repository URL</label><input id="repoUrl" style="width:100%" placeholder="https://github.com/creator/pack" autocomplete="url"></div><details><summary class="disclosure">Advanced options</summary><div class="two"><div class="field"><label for="branch">Branch</label><input id="branch" value="main"></div><div class="field"><label for="lockPath">Lock file path</label><input id="lockPath" value="mod.lock"></div></div></details><div class="toolbar" style="margin-top:14px"><label class="small" for="importScenario">Mock preview state</label><select id="importScenario" class="select"><option value="success">Successful preview · Schema 3</option><option value="schema">Unsupported schema</option><option value="profile">Game/loader unavailable</option><option value="network">Network unavailable</option></select><span class="spacer"></span><button onclick="pasteMockUrl()">Paste sample URL</button><button class="primary" onclick="showImportPreview()">Preview pack</button></div><div id="importResult" role="status" aria-live="polite"></div><p class="small">Preview does not modify files. Editing source settings invalidates the preview.</p></div>`}
    function pasteMockUrl(){document.getElementById('repoUrl').value='https://github.com/natimys/clockwork-valley';document.getElementById('repoUrl').focus()}
    function showImportPreview(){
      const result=document.getElementById('importResult');const url=document.getElementById('repoUrl').value.trim();
      if(!/^https:\/\//i.test(url)){result.innerHTML='<div class="warningbox" style="margin-top:15px">Enter a repository URL beginning with https:// before previewing.</div>';return}
      const scenario=document.getElementById('importScenario').value;
      if(scenario!=='success'){const text=scenario==='schema'?'This pack uses a schema this launcher cannot read. Check that the repository points to a supported ModLock pack.':scenario==='profile'?'The exact Minecraft or loader version is unavailable. Review the pack profile or try again later.':'The pack source could not be reached. Check the address and connection, then retry.';result.innerHTML=`<div class="${scenario==='network'?'errorbox':'warningbox'}" style="margin-top:15px">${text}</div><button style="margin-top:9px" onclick="showImportPreview()">Try again</button>`;return}
      result.innerHTML=`<hr style="border-color:var(--line);margin:18px 0"><div class="hero"><div class="icon gold">C</div><div><h2>Clockwork Valley</h2><div class="kicker">Pack 1.8.1 · Minecraft 1.21.1 · Fabric 0.16.10</div></div></div><div class="metrics" style="margin-top:14px"><div class="metric"><b>326 mods</b><span>Client and server</span></div><div class="metric"><b>34 managed files</b><span>In selected revision</span></div></div><div class="successbox" style="margin-top:14px">Schema 3 · explicit Client and Server assignments</div><p class="small">This creates a new instance. Your current library stays unchanged.</p><div class="dialogfoot"><button class="primary" onclick="this.textContent='Mock instance ready';this.disabled=true">Create instance</button></div>`;
    }

    render();
  </script>
</body>
</html>
